<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visual diagram</title>
  <link rel="stylesheet" href="diagram.css">
</head>
<body>
  <header>
    <h1 id="title">Visual diagram</h1>
    <!-- The focus path. diagram.js fills it and keeps Back in step with it. -->
    <button id="back" class="bar-btn" type="button" disabled>Back</button>
    <nav id="crumbs"></nav>
    <button id="showall" class="bar-btn" type="button" aria-pressed="false">Show all</button>
    <span class="hint">Click a node to go deeper · drag to pan · scroll to zoom</span>
  </header>

  <!-- diagram.js renders into #stage and transforms it for pan/zoom. -->
  <main id="canvas"><div id="stage"></div></main>

  <div id="notice" hidden></div>

  <script src="lib/mermaid.min.js"></script>
  <script src="diagram.js"></script>
</body>
</html>
